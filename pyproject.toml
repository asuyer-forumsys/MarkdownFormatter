[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mdnotes-formatter"
version = "0.1.0"
description = "Format markdown notes into a standardized structure"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
mdnotes-format = "mdnotes_formatter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mdnotes_formatter*"]
